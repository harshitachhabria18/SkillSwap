{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="card shadow-sm p-4" style="max-width: 600px; margin: auto;">

        <h3 class="mb-4 text-center">Leave Feedback for {{ reviewee.name }}</h3>

        <!-- Reviewee Info -->
        <div class="d-flex align-items-center mb-4">
            <img src="{% if reviewee.profile_photo and reviewee.profile_photo.startswith('http') %}{{ reviewee.profile_photo }}{% elif reviewee.profile_photo %}{{ url_for('static', filename='images/' + reviewee.profile_photo) }}{% else %}{{ url_for('static', filename='images/default_profile.png') }}{% endif %}"
            alt="Profile Photo"
            class="rounded-circle me-3"
            width="60" height="60">
            <div>
                <h5 class="mb-0">{{ reviewee.name }}</h5>
                <small class="text-muted">{{ reviewee.location or 'Location not set' }}</small>
            </div>
        </div>

        <hr>

        <!-- Feedback Form -->
        <form method="POST" action="{{ url_for('swap.leave_feedback', request_id=swap_req.id) }}">

            <!-- Star Rating -->
            <div class="mb-4">
                <label class="form-label"><strong>Rating</strong></label>
                <div class="d-flex gap-2">
                    {% for i in range(1, 6) %}
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="rating"
                               id="star{{ i }}" value="{{ i }}" required>
                        <label class="form-check-label" for="star{{ i }}">
                            {{ i }} ⭐
                        </label>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <!-- Comment -->
            <div class="mb-4">
                <label class="form-label"><strong>Comment (optional)</strong></label>
                <textarea class="form-control" name="comment" rows="4"
                          placeholder="Share your experience with this skill swap..."></textarea>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{{ url_for('swap.swap_requests') }}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-success">Submit Feedback</button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
