{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card text-center p-5" style="border-radius: 16px;">
                <div class="mb-4" style="font-size: 4rem;">🔒</div>
                <h2 class="mb-3" style="color: var(--navy);">This Profile is Private</h2>
                <p class="text-muted mb-4">
                    This user has chosen to keep their profile private.<br>
                    You cannot view their skills or send them a swap request.
                </p>
                <a href="{{ url_for('swap.home') }}" class="btn btn-success btn-lg">
                    ← Browse Other Users
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
