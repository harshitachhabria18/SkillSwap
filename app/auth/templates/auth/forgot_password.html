{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-5">

    <div class="card shadow-sm border-0 p-4" style="border-radius:16px;">
        <h2 class="mb-1 fw-bold text-center">Forgot password?</h2>
        <p class="text-muted text-center small mb-4">
            Enter your email and we'll send you a reset link.
        </p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-semibold" for="email">Email address</label>
                <input type="email" id="email" name="email"
                       class="form-control" placeholder="you@example.com" required autofocus>
            </div>
            <button type="submit" class="btn btn-success w-100">Send reset link</button>
        </form>

        <p class="text-center mt-3 mb-0 small text-muted">
            <a href="{{ url_for('auth.login') }}" class="text-decoration-none">← Back to login</a>
        </p>
    </div>

</div>
</div>
</div>
{% endblock %}
