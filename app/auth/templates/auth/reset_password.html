{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-5">

    <div class="card shadow-sm border-0 p-4" style="border-radius:16px;">
        <h2 class="mb-1 fw-bold text-center">Set new password</h2>
        <p class="text-muted text-center small mb-4">
            Choose a strong password (at least 8 characters).
        </p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-semibold" for="password">New password</label>
                <input type="password" id="password" name="password"
                       class="form-control" placeholder="••••••••" required minlength="8" autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold" for="confirm_password">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       class="form-control" placeholder="••••••••" required minlength="8">
            </div>
            <button type="submit" class="btn btn-success w-100">Update password</button>
        </form>
    </div>

</div>
</div>
</div>
{% endblock %}
